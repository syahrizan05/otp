services:
  otp_lembah_klang:
    image: opentripplanner/opentripplanner:2.9.0
    container_name: otp_lembah_klang
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx12G
    volumes:
      - ./runtime-kl:/var/opentripplanner
    command: --load --serve

  otp_penang:
    image: opentripplanner/opentripplanner:2.9.0
    container_name: otp_penang
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx8G
    volumes:
      - ./runtime-penang:/var/opentripplanner
    command: --load --serve